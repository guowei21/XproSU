android.useAndroidX=true
android.nonTransitiveRClass=true
android.r8.gradual.support=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
android.overridePathCheck=true

# ── U验证（uverif.com）授权服务接入 ──────────────────────────────────────────
# 在你自建 U验证 后台为「应用」选择 AES 加密方式，然后把下面 6 项填到
# local.properties（或设为同名环境变量）后重新构建。留空 = 未配置。
#   UVERIF_BASE_URL   服务地址，例：http://1.2.3.4:8008
#   UVERIF_APP_ID     应用 ID
#   UVERIF_APP_INDEX  版本索引（后台建应用时填的那个，如 ce）
#   UVERIF_APP_VER    版本号（如 1.0.0）
#   UVERIF_APP_KEY    应用密钥（用于 md5 签名）
#   UVERIF_AES_KEY    16 字节 AES 密钥（与后台一致）
# UVERIF_BASE_URL=
# UVERIF_APP_ID=
# UVERIF_APP_INDEX=
# UVERIF_APP_VER=
# UVERIF_APP_KEY=
# UVERIF_AES_KEY=
